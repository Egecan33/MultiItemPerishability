[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perish-bap"
version = "0.1.0"
description = "Multi-item perishable lot-sizing Branch-and-Price with FEFO DP pricing (Önal et al., 2015), dual stabilization, and order/no-order branching."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name="Your Name", email="you@example.com" }]
license = {text = "MIT"}
keywords = ["lot-sizing", "perishable", "branch-and-price", "column generation", "operations research"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = ["numpy>=1.23","PyYAML>=6.0"]

[project.scripts]
perish-bap = "perish_bap.cli:main"

[tool.setuptools.package-data]
perish_bap = ["py.typed"]

[tool.setuptools.packages.find]
where = [""]
exclude = ["tests*","examples*","scripts*"]
